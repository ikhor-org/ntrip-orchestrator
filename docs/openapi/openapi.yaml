openapi: 3.0.3
info:
  title: grokbot Control API
  version: 0.1.0-m1
  description: |
    M1 control API for GNSS RTK OEM/fleet correction orchestration.
    Live org provisioning is gated: POST /v0/orgs without screening → 403 screening_required.
    Fixture orgs only in non-prod when ALLOW_FIXTURE_ORGS=true.
    Vault encrypts upstream secrets (AES-256-GCM). Device provision returns pseudo-password once.
    No fund custody, no location analytics in metering, no CPOS routing.
servers:
  - url: http://localhost:8080
    description: Local M1
tags:
  - name: orgs
  - name: devices
  - name: vault
  - name: health
  - name: audit
  - name: usage
paths:
  /healthz:
    get:
      tags: [health]
      summary: Process liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
  /v0/orgs:
    post:
      tags: [orgs]
      summary: Create org (gated)
      description: |
        Live org create requires screening readiness.
        Without it, returns 403 with error code screening_required.
        Fixture create allowed only in non-prod with X-Allow-Fixture-Orgs: true and body.fixture=true.
      parameters:
        - name: X-Allow-Fixture-Orgs
          in: header
          required: false
          schema:
            type: string
            enum: ["true"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgCreate"
      responses:
        "201":
          description: Fixture org created (non-prod only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "403":
          description: Live org create blocked pending screening
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                screening_required:
                  value:
                    error: screening_required
                    message: Live org provisioning requires end-use/sanctions screening before activation.
  /v0/orgs/{org_id}:
    get:
      tags: [orgs]
      summary: Get org
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v0/orgs/{org_id}/devices:
    get:
      tags: [devices]
      summary: List devices
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Device"
    post:
      tags: [devices]
      summary: Provision device (fixture org only)
      description: |
        Creates device + pseudo-credential. Password returned once; only scrypt hash stored.
        Allowed only for fixture orgs when ALLOW_FIXTURE_ORGS=true.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
      responses:
        "201":
          description: Device provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceProvisioned"
        "403":
          description: Not a fixture org / fixtures disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v0/devices/{device_id}:
    get:
      tags: [devices]
      summary: Get device
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v0/fixture/upstream-secret:
    post:
      tags: [vault]
      summary: Seed fixture upstream + vault secret (dev)
      description: |
        Encrypts ntrip_basic username/password with VAULT_KEK (AES-256-GCM).
        Returns metadata only (last4). Never returns plaintext password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpstreamSecretCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamSecretMeta"
  /v0/orgs/{org_id}/upstreams:
    get:
      tags: [vault]
      summary: List upstreams + vault metadata (no plaintext)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Upstream list
  /v0/orgs/{org_id}/health:
    get:
      tags: [health]
      summary: Org health rollup
      description: |
        Health/SLA only. last_gga_age_ms for live sessions —
        last position is ephemeral and dropped on session end (not track history).
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgHealth"
  /v0/orgs/{org_id}/audit:
    get:
      tags: [audit]
      summary: Audit events (M1 list)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Audit events
  /v0/orgs/{org_id}/usage/events:
    get:
      tags: [usage]
      summary: Metering events
      description: |
        Metering fields are connect/bytes/device-days only.
        Schemas MUST NOT include lat, lon, GGA, or track points.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Metering events
components:
  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Healthz:
      type: object
      required: [ok, service]
      properties:
        ok:
          type: boolean
        service:
          type: string
        milestone:
          type: string
          example: M1
    OrgCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        fixture:
          type: boolean
          description: If true, only accepted with fixture header in non-prod
    Org:
      type: object
      required: [id, name, status, screening_status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [fixture, pending_screening, active, suspended]
        screening_status:
          type: string
          enum: [required, pending, cleared, rejected, fixture_exempt]
    DeviceCreate:
      type: object
      properties:
        label:
          type: string
        profile_id:
          type: string
          format: uuid
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        label:
          type: string
        status:
          type: string
          enum: [active, revoked]
    DeviceProvisioned:
      type: object
      required: [device, pseudo_username, pseudo_password]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        pseudo_username:
          type: string
        pseudo_password:
          type: string
          description: Returned once — never stored in plaintext
    UpstreamSecretCreate:
      type: object
      required: [host, username, password]
      properties:
        display_name: { type: string }
        host: { type: string }
        port: { type: integer, default: 2101 }
        use_tls: { type: boolean }
        mountpoint: { type: string }
        username: { type: string }
        password: { type: string }
    UpstreamSecretMeta:
      type: object
      properties:
        upstream_id: { type: string, format: uuid }
        secret_id: { type: string, format: uuid }
        last4: { type: string }
        adapter_type: { type: string }
        host: { type: string }
        port: { type: integer }
        mountpoint: { type: string }
    OrgHealth:
      type: object
      properties:
        org_id:
          type: string
          format: uuid
        active_sessions:
          type: integer
        sessions:
          type: array
          items:
            type: object
            properties:
              session_id: { type: string, format: uuid }
              device_id: { type: string, format: uuid }
              last_gga_age_ms: { type: integer, nullable: true }
              has_last_position: { type: boolean }
        notes:
          type: string
          example: GGA/last-position for session health only — no track histories
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    MeteringSessionStarted:
      type: object
      description: usage.session_started — no location fields
      properties:
        org_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        upstream_id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
    MeteringSessionEnded:
      type: object
      description: usage.session_ended — connect/bytes only
      properties:
        session_id: { type: string, format: uuid }
        duration_ms: { type: integer }
        bytes_up: { type: integer }
        bytes_down: { type: integer }
        end_reason: { type: string }
    MeteringDeviceDay:
      type: object
      description: usage.device_day — no location fields
      properties:
        org_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        day: { type: string, format: date }
        active_seconds: { type: integer }
